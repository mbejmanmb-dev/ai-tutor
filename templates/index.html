<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark AI Tutor - HUD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            border: 1px solid #30363d;
        }
        h2 {
            color: #00d2ff;
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.4rem;
        }
        .hud-subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        #chat-box {
            height: 350px;
            overflow-y: auto;
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background: #1f6feb;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .stark-msg {
            background: #21262d;
            color: #58a6ff;
            align-self: flex-start;
            border-left: 3px solid #00d2ff;
            border-bottom-left-radius: 2px;
        }
        .system-msg {
            background: #38290d;
            color: #d29922;
            align-self: center;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            border-color: #00d2ff;
            outline: none;
        }
        button.btn-primary {
            padding: 12px 20px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-primary:hover {
            background: #2ea043;
        }
        button.btn-stop {
            padding: 12px 15px;
            background: #da3633;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-stop:hover {
            background: #f85149;
        }
        #game-panel {
            padding: 15px;
            border: 1px solid #00d2ff;
            border-radius: 8px;
            background: #0d1117;
        }
        #game-panel h3 {
            margin-top: 0;
            color: #00d2ff;
            font-size: 1rem;
        }
        .game-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .game-buttons button {
            padding: 10px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .game-buttons button:hover {
            background: #388bfd;
        }
        #status-indicator {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 5px;
            font-style: italic;
            height: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Stark AI Tutor</h2>
        <div class="hud-subtitle">System Wspomagania Edukacji v3.6 // Profil: Maks (6 Klasa)</div>
        
        <div id="status-indicator">Status: Gotowy do działania</div>
        <div id="chat-box"></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Wpisz wiadomość do Starka..." onkeypress="handleKeyPress(event)">
            <button class="btn-primary" onclick="sendMessage()">Wyślij</button>
            <button class="btn-stop" onclick="stopSpeech()" title="Zatrzymaj mowę lektora">Wycisz</button>
        </div>

        <div id="game-panel">
            <h3>Wybierz misję bojową (Gra jednorundowa):</h3>
            <div class="game-buttons">
                <button onclick="startMission('matematyka')">Matematyka</button>
                <button onclick="startMission('historia')">Historia</button>
                <button onclick="startMission('przyroda')">Przyroda</button>
                <button onclick="startMission('geografia')">Geografia</button>
                <button onclick="startMission('język polski')">J. Polski</button>
            </div>
        </div>
    </div>

    <script>
        function setStatus(text) {
            document.getElementById('status-indicator').innerText = "Status: " + text;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'pl-PL';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                setStatus("Wyciszono mowę lektora.");
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            if (sender === 'Maks') {
                msgDiv.classList.add('user-msg');
                msgDiv.innerHTML = `<b>Ty:</b> ${text}`;
            } else if (sender === 'System') {
                msgDiv.classList.add('system-msg');
                msgDiv.innerHTML = `${text}`;
            } else {
                msgDiv.classList.add('stark-msg');
                msgDiv.innerHTML = `<b>Stark:</b> ${text}`;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('Maks', text);
            input.value = '';
            setStatus("Stark przetwarza dane...");

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage('Stark', data.reply);
                speakText(data.reply);
                setStatus("Gotowy");
            } catch (err) {
                appendMessage('System', 'Błąd połączenia ze zbroją.');
                setStatus("Błąd krytyczny");
            }
        }

        async function startMission(subject) {
            appendMessage('System', `== Uruchamianie symulacji bojowej: ${subject.toUpperCase()} ==`);
            setStatus(`Generowanie misji (${subject})...`);

            try {
                const response = await fetch('/api/game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: subject })
                });
                const data = await response.json();
                appendMessage('Stark', data.reply);
                speakText(data.reply);
                setStatus("Misja aktywna");
            } catch (err) {
                appendMessage('System', 'Awaria systemu gier Starka!');
                setStatus("Błąd misji");
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Powitanie startowe
        window.onload = function() {
            appendMessage('Stark', 'Systemy Starka w pełni online. Witaj w bazie, Maks. Wybierz temat z panelu poniżej lub napisz do mnie, co dzisiaj rozpracowujemy.');
        };
    </script>
</body>
</html>
