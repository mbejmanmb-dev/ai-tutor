<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Lab - AI Korepetytor</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .header {
            background: linear-gradient(135deg, #7f1d1d, #991b1b, #1e293b);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ef4444;
        }
        .stark-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            background-color: #000;
            object-fit: cover;
        }
        .header-info h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #fef08a;
        }
        .header-info p {
            margin: 2px 0 0 0;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #0f172a;
        }
        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 85%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.bot {
            align-self: flex-start;
        }
        .avatar-msg {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .user .avatar-msg {
            background-color: #2563eb;
            color: white;
        }
        .bubble {
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user .bubble {
            background-color: #2563eb;
            color: white;
            border-top-right-radius: 2px;
        }
        .bot .bubble {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-top-left-radius: 2px;
        }
        .bubble table {
            border-collapse: collapse;
            margin: 12px 0;
            width: 100%;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .bubble th, .bubble td {
            border: 1px solid #334155;
            padding: 8px 12px;
            text-align: center;
        }
        .bubble th {
            background-color: #334155;
            color: #fef08a;
            font-weight: bold;
        }
        .bubble td {
            color: #f8fafc;
        }
        .input-area {
            padding: 16px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }
        input[type="text"]:focus {
            border-color: #ef4444;
        }
        .btn-mic {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .btn-mic.recording {
            background: #dc2626;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .btn-main {
            padding: 12px 24px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-main:hover {
            background: #b91c1c;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #ef4444;
        }
        .modal-content h2 { margin-top: 0; color: #fef08a; }
        .modal-content label { display: block; margin: 10px 0 5px; font-size: 0.9rem; }
        .modal-content input { width: 100%; box-sizing: border-box; }
        .modal-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
        .typing { font-style: italic; color: #94a3b8; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .btn-game-subject {
            background: #0f172a;
            color: #fef08a;
            border: 1px solid #ef4444;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-game-subject:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="stark-profile">
            <img class="avatar-img" src="https://img.freepik.com/free-vector/hand-drawn-superhero-illustration_23-2150965313.jpg" alt="Tony Stark Avatar">
            <div class="header-info">
                <h1>Stark AI Korepetytor</h1>
                <p>Uczeń: <b>Maks</b> | Klasa 6</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-secondary" id="ttsToggleBtn" onclick="toggleTTS()" title="Przełącz czytanie na głos">🔊 Lektor: WŁ</button>
            <button class="btn-secondary" onclick="openGameModal()">🎮 Misja (Gra)</button>
            <button class="btn-secondary" onclick="openQuizModal()">📝 Quiz</button>
            <button class="btn-secondary" onclick="clearHistory()">🗑️ Wyczyść</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Wpisz odpowiedź lub pytanie..." onkeypress="handleKeyPress(event)">
        <button class="btn-mic" id="micBtn" onclick="toggleSpeech()" title="Mów do mikrofonu">🎤</button>
        <button class="btn-main" onclick="sendMessage()">Wyślij</button>
    </div>
</div>

<div class="modal" id="quizModal">
    <div class="modal-content">
        <h2>Generuj Quiz / Sprawdzian</h2>
        <label>Przedmiot:</label>
        <input type="text" id="quizSubject" placeholder="np. Matematyka, Biologia">
        <label>Temat:</label>
        <input type="text" id="quizTopic" placeholder="np. Trójkąty, Układ Słoneczny">
        <label>Liczba pytań:</label>
        <input type="number" id="quizNum" value="3" min="1" max="5">
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeQuizModal()">Anuluj</button>
            <button class="btn-main" onclick="submitQuiz()">Generuj</button>
        </div>
    </div>
</div>

<div class="modal" id="gameModal">
    <div class="modal-content">
        <h2>Wybierz Misję Bojową (1 Runda)</h2>
        <p style="font-size: 0.85rem; color: #cbd5e1;">Tony Stark stworzy dynamiczne wyzwanie edukacyjne dla 6 klasy z wybranego przedmiotu:</p>
        
        <div class="game-grid">
            <button class="btn-game-subject" onclick="submitGame('Matematyka')">📐 Matematyka</button>
            <button class="btn-game-subject" onclick="submitGame('Historia')">📜 Historia</button>
            <button class="btn-game-subject" onclick="submitGame('Przyroda')">🌿 Przyroda</button>
            <button class="btn-game-subject" onclick="submitGame('Geografia')">🌍 Geografia</button>
            <button class="btn-game-subject" onclick="submitGame('Język Polski')">📖 Język Polski</button>
            <button class="btn-game-subject" onclick="submitGame('Język Angielski')">🇬🇧 J. Angielski</button>
        </div>

        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeGameModal()">Zamknij</button>
        </div>
    </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
    let recognition = null;
    let isRecording = false;
    let ttsEnabled = true;

    function formatText(text) {
        if (!text) return "";
        let formatted = text
            .replace(/###\s?/g, '')
            .replace(/\$(.*?)\$/g, '$1')
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.*?)\*/g, '<i>$1</i>')
            .replace(/\n/g, '<br>');
        return formatted;
    }

    function prepareTextForSpeech(rawText) {
        if (!rawText) return "";

        let tempDiv = document.createElement("div");
        tempDiv.innerHTML = formatText(rawText);

        const tables = tempDiv.querySelectorAll("table, svg");
        tables.forEach(t => t.remove());

        let cleanText = tempDiv.textContent || tempDiv.innerText || "";

        cleanText = cleanText.replace(/(^|\s)-(\d+)/g, '$1minus $2');

        cleanText = cleanText
            .replace(/[-_]{2,}/g, ' ')
            .replace(/\s-\s/g, ' ')
            .replace(/[*#$]/g, '')
            .replace(/WIZUALIZACJA:/gi, '')
            .replace(/\s+/g, ' ')
            .trim();

        return cleanText;
    }

    function stopSpeaking() {
        const audioPlayer = document.getElementById("audioPlayer");
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    function speakText(text) {
        if (!ttsEnabled) return;

        stopSpeaking();

        const cleanText = prepareTextForSpeech(text);
        if (!cleanText) return;

        const audioPlayer = document.getElementById("audioPlayer");
        const encodedText = encodeURIComponent(cleanText.substring(0, 200));
        const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=pl&client=tw-ob`;

        audioPlayer.src = googleTtsUrl;
        audioPlayer.play().catch(() => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'pl-PL';
                utterance.rate = 0.9;
                utterance.pitch = 0.6;
                window.speechSynthesis.speak(utterance);
            }
        });
    }

    function toggleTTS() {
        ttsEnabled = !ttsEnabled;
        const btn = document.getElementById("ttsToggleBtn");
        if (ttsEnabled) {
            btn.innerHTML = "🔊 Lektor: WŁ";
            btn.style.background = "#334155";
        } else {
            btn.innerHTML = "🔇 Lektor: WYŁ";
            btn.style.background = "#7f1d1d";
            stopSpeaking();
        }
    }

    async function loadHistory() {
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = "";

        try {
            const res = await fetch('/api/history');
            const history = await res.json();

            if (!history || history.length === 0) {
                const initMsg = "Cześć Maks! Tu Tony. Wszystkie systemy działają. O czym powiemy sobie dzisiaj?";
                appendMessage("bot", initMsg, false);
            } else {
                history.forEach(msg => {
                    appendMessage(msg.role === "user" ? "user" : "bot", msg.content, false);
                });
            }
        } catch (e) {
            appendMessage("bot", "Cześć Maks! Gotowy do nauki?", false);
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text) return;

        stopSpeaking();

        appendMessage("user", text, false);
        input.value = "";

        showTyping();

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            removeTyping();

            const data = await res.json();
            if (data.reply) {
                appendMessage("bot", data.reply, true);
            }
        } catch (e) {
            removeTyping();
            appendMessage("bot", "Systemy nie odpowiedziały. Spróbuj powtórzyć.", true);
        }
    }

    function appendMessage(sender, text, shouldSpeak = false) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;

        if (sender === "bot") {
            const img = document.createElement("img");
            img.className = "avatar-img";
            img.style.width = "36px";
            img.style.height = "36px";
            img.src = "https://img.freepik.com/free-vector/hand-drawn-superhero-illustration_23-2150965313.jpg";
            msgDiv.appendChild(img);
        } else {
            const avatarDiv = document.createElement("div");
            avatarDiv.className = "avatar-msg";
            avatarDiv.textContent = "👦";
            msgDiv.appendChild(avatarDiv);
        }

        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "bubble";
        bubbleDiv.innerHTML = formatText(text);

        msgDiv.appendChild(bubbleDiv);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (sender === "bot" && shouldSpeak) {
            speakText(text);
        }
    }

    function showTyping() {
        const chatBox = document.getElementById("chatBox");
        const typingDiv = document.createElement("div");
        typingDiv.id = "typingIndicator";
        typingDiv.className = "message bot";
        typingDiv.innerHTML = `
            <img class="avatar-img" style="width:36px; height:36px;" src="https://img.freepik.com/free-vector/hand-drawn-superhero-illustration_23-2150965313.jpg">
            <div class="bubble typing">Stark AI analizuje dane...</div>
        `;
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();
    }

    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'pl-PL';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById("userInput").value = transcript;
            stopSpeech();
        };

        recognition.onerror = () => stopSpeech();
        recognition.onend = () => stopSpeech();
    }

    function toggleSpeech() {
        if (!recognition) initSpeech();
        if (!recognition) return;

        if (isRecording) {
            stopSpeech();
        } else {
            stopSpeaking();
            recognition.start();
            isRecording = true;
            document.getElementById("micBtn").classList.add("recording");
        }
    }

    function stopSpeech() {
        if (recognition && isRecording) {
            recognition.stop();
        }
        isRecording = false;
        document.getElementById("micBtn").classList.remove("recording");
    }

    async function clearHistory() {
        if (confirm("Czy na pewno chcesz wyczyścić historię rozmowy?")) {
            stopSpeaking();
            await fetch('/api/history', { method: 'DELETE' });
            loadHistory();
        }
    }

    function openQuizModal() { document.getElementById("quizModal").style.display = "flex"; }
    function closeQuizModal() { document.getElementById("quizModal").style.display = "none"; }

    function openGameModal() { document.getElementById("gameModal").style.display = "flex"; }
    function closeGameModal() { document.getElementById("gameModal").style.display = "none"; }

    async function submitGame(subject) {
        closeGameModal();
        stopSpeaking();

        appendMessage("user", `Uruchom misję bojową z przedmiotu: ${subject}`, false);
        showTyping();

        try {
            const res = await fetch("/api/game", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subject: subject })
            });

            removeTyping();
            const data = await res.json();
            if (data.reply) {
                appendMessage("bot", data.reply, true);
            }
        } catch (e) {
            removeTyping();
            appendMessage("bot", "Systemy zbroi nie odpowiedziały. Spróbuj ponownie.", true);
        }
    }

    async function submitQuiz() {
        const subject = document.getElementById("quizSubject").value;
        const topic = document.getElementById("quizTopic").value;
        const num = document.getElementById("quizNum").value;

        if (!subject || !topic) return;

        closeQuizModal();
        appendMessage("user", `Wygeneruj quiz: ${subject}, temat: ${topic}`, false);
        showTyping();

        try {
            const res = await fetch("/api/quiz", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subject, topic, num_questions: parseInt(num) })
            });

            removeTyping();
            const data = await res.json();
            if (data.quiz) {
                appendMessage("bot", "**Oto Twój quiz:**\n\n" + data.quiz, true);
            }
        } catch (e) {
            removeTyping();
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    window.onload = loadHistory;
</script>

</body>
</html>
